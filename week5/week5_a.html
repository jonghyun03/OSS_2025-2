<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>

  <style>
    /* div.example {
      font-size: 50px;
      background-color: yellowgreen;
    }

    @media only screen and (max-width: 600px) {
      div.example {
        font-size: 40px;
        background-color: pink;
      }
    }

    @media only screen and (max-width: 450px) {

      }
    } */
    
    div.example1 {
      font-size: 30px;
      background-color: aquamarine;
    }

    div.example2 {
      font-size: 40px;
      background-color: pink;
    }

    div.example3 {
      font-size: 50px;
      background-color: yellowgreen;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    .div_img {
      background-image: url('https://image.utoimage.com/preview/cp872722/2022/12/202212008462_500.jpg');
      background-size: 100% 100%;
      height: 300px;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }
  </style>

  <body>
    <div class="example">
      example
    </div>

    <!-- <img src="https://image.utoimage.com/preview/cp872722/2022/12/202212008462_500.jpg" alt="dog image"> -->

    <div class="div_img">

    </div>
    <!-- 가로 450 이하일때 배경 아쿠아마린, 글자는 30픽셀.
    가로 451~600 일때, 배경은 핑크, 글자크기는 40픽셀
    가로 601 이상일때, 배경은 옐로우그린, 글자크기는 50픽셀 -->

    <button onclick="confirm_img()" class="btn_img">change img</button>

    <script>
      let width1 = window.innerWidth;
      let width2 = $(window).width();
      console.log(width1, width2);

      listener_resize();
      function listener_resize() {
        width = window.innerWidth;
        $('.example').removeClass('example1', 'example2', 'example3');
        if (width > 600) {
          $('.example').addClass('example3');
        } else if (width > 450) {
          $('.example').addClass('example2');
        } else {
          $('.example').addClass('example1');
        }
      }
      
      window.addEventListener('resize', () => {
        width1 = window.innerWidth;
        width2 = $(window).width();
        $('.example').removeClass('example1', 'example2', 'example3');
        if (width1 > 600) {
          $('.example').addClass('example3');
          $('.example').removeClass('example1', 'example2');
        } else if (width2 > 450) {
          $('.example').addClass('example2');
          $('.example').removeClass('example3', 'example1');
        } else {
          $('.example').addClass('example1');
          $('.example').removeClass('example2', 'example3');
        }
      })

      function confirm_img() {
        const tmp = confirm('이미지를 변경하시겠습니까?');
        if (tmp) {
          $('.div_img').css('background-image', `url(https://www.urbanbrush.net/web/wp-content/uploads/edd/2023/02/urban-20230228144115810458.jpg)`);
          alert('이미지가 변경되었습니다.');
          $('.btn_img').css('display', 'none');
          
        }
      }
      
    </script>

    
</body>
</html>
